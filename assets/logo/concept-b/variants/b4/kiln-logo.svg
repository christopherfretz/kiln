    <path id="kb4-l" transform="translate(173,0)" d="M0,-144H28V0H0Z" fill="#1c1e24"/>
    <path id="kb4-n" transform="translate(225,0)" d="M0,0V-100H28V-94.9A50,50 0 0 1 100,-50V0H72V-50A22,22 0 0 0 28,-50V0Z" fill="#1c1e24"/>
  </g>
