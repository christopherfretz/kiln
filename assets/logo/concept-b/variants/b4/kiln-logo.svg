    <path d="M180.0,115H188.0V124.0H197V132.0H188.0V141H180.0V132.0H171V124.0H180.0ZM214.0,115H222.0V124.0H231V132.0H222.0V141H214.0V132.0H205V124.0H214.0Z" fill="#ffab2e" opacity=".7" filter="url(#kb4-pglow)"/>
