<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646.03 256" width="646.03" height="256" role="img" aria-label="kiln">
  <title>kiln</title>
  <defs>
    <linearGradient id="kb4-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f37"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <radialGradient id="kb4-ember" cx="128" cy="250" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a12" stop-opacity=".45"/><stop offset="1" stop-color="#ff5a12" stop-opacity="0"/></radialGradient>
    <linearGradient id="kb4-stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f5f8"/><stop offset=".65" stop-color="#aab2bd"/><stop offset="1" stop-color="#e8b388"/></linearGradient>
    <radialGradient id="kb4-hot" cx="104" cy="128" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe9"/><stop offset=".22" stop-color="#ffe17a"/>
      <stop offset=".5" stop-color="#ff8a1f"/><stop offset=".8" stop-color="#e2380f"/>
      <stop offset="1" stop-color="#a5160a"/></radialGradient>
    <linearGradient id="kb4-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/><stop offset=".45" stop-color="#9aa3af"/>
      <stop offset="1" stop-color="#4b525d"/></linearGradient>
    <linearGradient id="kb4-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#ffab2e"/></linearGradient>
    <filter id="kb4-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="kb4-tittle" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd23f"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e0340e"/></linearGradient>
    <linearGradient id="kb4-chev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd23f"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d9310f"/></linearGradient>
  </defs>
  <g id="kb4-mark">
