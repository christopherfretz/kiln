    <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#kb4-ember)"/>
    <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" fill="none" stroke="#2c3038" stroke-width="3"/>
    <g transform="translate(128,128) scale(.9) translate(-130.5,-128)">
