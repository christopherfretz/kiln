<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kiln">
  <title>kiln</title>
  <defs>
    <linearGradient id="ka-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f48"/><stop offset="1" stop-color="#16181d"/></linearGradient>
    <linearGradient id="ka-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c0ca"/><stop offset=".5" stop-color="#7c848f"/>
      <stop offset="1" stop-color="#4b515b"/></linearGradient>
    <radialGradient id="ka-mouth" cx="128" cy="222" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb43a"/><stop offset=".35" stop-color="#f05a14"/>
      <stop offset=".7" stop-color="#9e1b0b"/><stop offset="1" stop-color="#3a0905"/></radialGradient>
    <linearGradient id="ka-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fffbe9"/><stop offset=".45" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#ff9a26"/></linearGradient>
    <linearGradient id="ka-tongue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#e2410f"/></linearGradient>
    <linearGradient id="ka-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/><stop offset=".5" stop-color="#ffc23d"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- mark -->
  <g id="ka-kiln">
    <!-- chimney with a glowing damper slot -->
    <path d="M104,46L110,24H146L152,46Z" fill="url(#ka-body)" stroke="#0e0f12" stroke-width="3" stroke-linejoin="round"/>
    <rect x="96" y="14" width="64" height="14" rx="3" fill="url(#ka-body)" stroke="#0e0f12" stroke-width="3"/>
    <rect x="114" y="32" width="28" height="6" rx="2" fill="#ffb43a"/>
    <!-- dome body -->
    <path d="M30,222V124C30,74 74,42 128,42C182,42 226,74 226,124V222Z" fill="url(#ka-body)" stroke="#0e0f12" stroke-width="3" stroke-linejoin="round"/>
    <!-- fire mouth -->
    <path id="ka-mouthshape" d="M72,222V156A56,56 0 0 1 184,156V222Z" fill="url(#ka-mouth)"/>
    <!-- background flame tongues -->
    <path d="M80,222C78,200 86,186 92,172C94,186 100,190 104,198C106,206 104,216 100,222Z" fill="url(#ka-tongue)"/>
    <path d="M176,222C178,202 172,190 166,178C162,192 156,198 154,206C152,214 154,220 156,222Z" fill="url(#ka-tongue)"/>
    <!-- the flame K: stem, rising arm, leg -->
    <g id="ka-flamek" fill="url(#ka-flame)">
      <path d="M100,222V140C100,128 106,116 114,106C113,118 120,122 122,132V222Z"/>
      <path d="M118,188L118,162C132,150 146,134 152,116C154,110 154,104 152,96C164,108 170,124 166,140C162,156 148,166 136,178Z"/>
      <path d="M126,176L146,166C152,182 160,202 168,222H142C138,206 132,190 126,176Z"/>
    </g>
    <!-- angle brackets flanking the fire -->
    <g id="ka-brackets" fill="none" stroke="#ffc94a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92,150L82,162L92,174"/><path d="M164,150L174,162L164,174"/>
    </g>
    <!-- steel arch ring with voussoir seams and keystone -->
    <path d="M58,222V156A70,70 0 0 1 198,156V222H184V156A56,56 0 0 0 72,156V222Z" fill="url(#ka-steel)" stroke="#0e0f12" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#2a2e35" stroke-width="2.5" stroke-linecap="round">
      <path d="M58,186H72M184,186H198M64.4,126.4L77.3,131.8M191.6,126.4L178.7,131.8M88,99.6L95,111M168,99.6L161,111"/>
    </g>
    <path d="M118,82H138L135,102H121Z" fill="url(#ka-steel)" stroke="#0e0f12" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- hearth plinth with ember lines -->
    <rect x="16" y="218" width="224" height="24" rx="5" fill="url(#ka-body)" stroke="#0e0f12" stroke-width="3"/>
    <rect x="34" y="228" width="44" height="4" rx="2" fill="url(#ka-glow)"/>
    <rect x="178" y="228" width="44" height="4" rx="2" fill="url(#ka-glow)"/>
    <rect x="72" y="218" width="112" height="5" fill="#ffb43a"/>
  </g>
</svg>
