[package]
name = "kiln-hod-driver"
description = "kiln's driver with hod registered as its in-process back end."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Installed as `kiln` (and `kiln++`, the symlink kiln_driver's build script
# makes beside it), as the stock driver is.
[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
kiln_driver.workspace = true
kiln_hod.workspace = true

[lints]
workspace = true

[dev-dependencies]
kiln_llvm.workspace = true
