[package]
name = "kiln_oven"
description = "The Oven: constant evaluator (bytecode compiler, VM, abstract memory model, `std::meta` runtime)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kiln_source.workspace = true
kiln_diag.workspace = true
kiln_ast.workspace = true
kiln_snap.workspace = true

[features]
# The dynamic opcode histogram on stderr (`vm/opstats.rs`; WP-648), a
# measurement aid: `cargo build --release -p kiln_driver --features
# kiln_oven/op-stats`.
op-stats = []
# Checks every trial-fold fast-path answer against the full path
# (`leaf.rs`; WP-656), a validation build: `--features kiln_oven/leaf-check`.
leaf-check = []

[dev-dependencies]
# Record layouts and target sizes for the test bridge (the real bridge is
# kiln_sema, which owns the kiln_abi call).
kiln_abi.workspace = true

[lints]
workspace = true
