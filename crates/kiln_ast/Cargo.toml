[package]
name = "kiln_ast"
description = "The typed AST: types, declarations, expressions, statements, templates; stable dump format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kiln_source.workspace = true
kiln_diag.workspace = true
hashbrown.workspace = true

[features]
# Selects the std-only fallback `InternTable` for type interning instead of
# hashbrown's `HashTable` (spec/types.md §7.1, §17 T1). Same API, more bytes
# per entry; kept compiling and tested so the dependency stays optional in
# principle.
std-intern = []

[lints]
workspace = true
