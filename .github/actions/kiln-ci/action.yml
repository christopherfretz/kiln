name: kiln-ci
description: >
  The steps shared by the `check` and `check-x86_64` jobs (docs/VALIDATION.md
  "GitHub Actions"): the Debian toolchain packages, the pinned Rust
  toolchain, the cargo cache, `cargo xtask ci` (oracle clang 22) and
  `KILN_ORACLE=19 cargo xtask ci --quick --oracle-only`. A local action is only
  readable after checkout, so each job installs git and checks out first.
runs:
  using: composite
  steps:
    - name: Install the toolchain packages
      shell: bash
      run: |
        apt-get update -qq
        # libc++-22-dev conflicts with libc++-19-dev; the corpus needs only
        # libc++ 19 (the M4 libc++ gate uses an extracted libc++ 22 tree,
        # spec/libcxx.md "Toolchain", and does not run in CI).
        apt-get install -y -qq --no-install-recommends \
          ca-certificates curl git build-essential procps time \
          clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev \
          clang-22 llvm-22 lld-22 >/dev/null
        clang++-19 --version | head -1
        clang++-22 --version | head -1
    # The job runs as root in a container whose $HOME is /github/home while
    # root's passwd home is /root; rustup-init's anti-sudo check refuses that
    # mismatch (nondeterministically across runners). Skip the check: there is
    # no sudo here, and CARGO_HOME/RUSTUP_HOME are set explicitly by the action.
    - uses: dtolnay/rust-toolchain@stable
      with: { toolchain: "1.99.1", components: "rustfmt, clippy" }
      env: { RUSTUP_INIT_SKIP_SUDO_CHECK: "yes" }
    # Saved even when `ci` fails, so the next run starts warm.
    - uses: Swatinem/rust-cache@v2
      with: { cache-on-failure: true }
    # fmt, clippy, cargo test, then both corpus runs (clang self-check and
    # kiln), as `cargo xtask ci` locally; the oracle is clang 22.
    - name: cargo xtask ci
      shell: bash
      run: cargo xtask ci
    # The two-oracle policy (spec/harness.md "Oracle toolchain", WP-355):
    # the corpus also stays green with clang 19 as the oracle. Only the
    # cargo test targets that read KILN_ORACLE are rerun; fmt, clippy and
    # the rest of `cargo test` do not depend on it (spec/harness.md "CI",
    # `--oracle-only`, WP-488).
    - name: KILN_ORACLE=19 cargo xtask ci --quick --oracle-only
      if: ${{ !cancelled() }}
      shell: bash
      run: KILN_ORACLE=19 cargo xtask ci --quick --oracle-only
