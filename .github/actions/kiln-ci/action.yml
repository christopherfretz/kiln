name: kiln-ci
description: >
  The setup every job of .github/workflows/ci-lane.yml shares
  (docs/VALIDATION.md "GitHub Actions"): the Debian toolchain packages (plus
  gdb and lldb-19 where the job runs the debugger tests, compiler-rt's
  sanitizer runtimes where it runs the corpus, and cmake and ninja where it
  runs the CMake modules end-to-end), a
  check that the image's GCC 16.1 (the reflection oracle, `KILN_GCC` from the
  job env) compiles a `<meta>` TU, the pinned Rust toolchain and the cargo
  cache. The job then runs its slice of `cargo xtask ci`. A local action is
  only readable after checkout, so each job checks out first.
inputs:
  cache-key:
    description: rust-cache's shared-key; one per architecture, so every job of a lane restores the same cache.
    required: true
  save-cache:
    description: '"true" in the one job per lane that saves the cache (it builds the most targets).'
    required: false
    default: "false"
  debuggers:
    description: >
      "true" in the jobs that run the corpus (and the harness's own tests):
      install gdb and lldb-19 for the `expect: debugger` tests in
      tests/debuginfo (WP-816, spec/harness.md "Debugger tests"). The job
      env's KILN_REQUIRE_DEBUGGERS=1 makes a missing debugger an ERROR.
    required: false
    default: "false"
  sanitizer-runtimes:
    description: >
      "true" in the jobs that run the corpus: install compiler-rt for both
      clangs (libclang-rt-19-dev, libclang-rt-22-dev), which the
      `requires: sanitizer-runtime` run tests link (WP-1032, WP-1034;
      spec/harness.md "Directives"). The job env's
      KILN_REQUIRE_SANITIZER_RUNTIME=1 makes a missing runtime an ERROR.
    required: false
    default: "false"
  cmake:
    description: >
      "true" in the one job per lane that runs `scripts/oss/selftest.sh
      --cmake-modules` (WP-982, WP-1034): install cmake (Debian trixie's
      3.31, the e2e needs 3.28) and ninja-build.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the toolchain packages
      shell: bash
      run: |
        apt-get update -qq
        # libc++-22-dev conflicts with libc++-19-dev; the corpus needs only
        # libc++ 19 (the M4 libc++ gate uses an extracted libc++ 22 tree,
        # spec/libcxx.md "Toolchain", and does not run in CI).
        apt-get install -y -qq --no-install-recommends \
          ca-certificates curl git build-essential procps time \
          clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev \
          clang-22 llvm-22 lld-22 >/dev/null
        clang++-19 --version | head -1
        clang++-22 --version | head -1
        if [ "${{ inputs.debuggers }}" = true ]; then
          apt-get install -y -qq --no-install-recommends gdb lldb-19 >/dev/null
          gdb --version | head -1
          lldb-19 --version | head -1
        fi
        if [ "${{ inputs.sanitizer-runtimes }}" = true ]; then
          apt-get install -y -qq --no-install-recommends \
            libclang-rt-19-dev libclang-rt-22-dev >/dev/null
          echo "compiler-rt: $(clang++-19 --print-runtime-dir) $(clang++-22 --print-runtime-dir)"
        fi
        if [ "${{ inputs.cmake }}" = true ]; then
          apt-get install -y -qq --no-install-recommends cmake ninja-build >/dev/null
          cmake --version | head -1
          echo "ninja $(ninja --version)"
        fi
        # The GCC oracle (spec/harness.md "GCC oracle"): the job's KILN_GCC
        # must be GCC 16.1 and compile libstdc++'s <meta> with reflection.
        "${KILN_GCC:?the job env sets KILN_GCC}" --version | head -1
        case "$("$KILN_GCC" -dumpfullversion)" in
          16.1.*) ;;
          *) echo "KILN_GCC=$KILN_GCC is not GCC 16.1" >&2; exit 1 ;;
        esac
        printf '#include <meta>\nstatic_assert(std::meta::is_type(^^int));\nint main() {}\n' \
          | "$KILN_GCC" -std=c++26 -freflection -fsyntax-only -x c++ -
    # The job runs as root in a container whose $HOME is /github/home while
    # root's passwd home is /root; rustup-init's anti-sudo check refuses that
    # mismatch (nondeterministically across runners). Skip the check: there is
    # no sudo here, and CARGO_HOME/RUSTUP_HOME are set explicitly by the action.
    - uses: dtolnay/rust-toolchain@stable
      with: { toolchain: "1.95.0", components: "rustfmt, clippy" }
      env: { RUSTUP_INIT_SKIP_SUDO_CHECK: "yes" }
    # ~/.cargo and the dependency builds, keyed per architecture
    # (`shared-key`) so every job of the lane restores the same entry; only
    # the `save-cache` job writes it, and saves it even when its tests fail,
    # so the next run starts warm. The workspace crates are not cached: a
    # fresh checkout gives every source file a new mtime, so cargo would
    # rebuild them all anyway, and they would make the cache (and every
    # job's restore) many times larger (docs/status/perf.md "WP-692").
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-on-failure: true
