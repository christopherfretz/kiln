name: ci-lane
# One architecture's half of the merge gate (WP-692; docs/VALIDATION.md
# "GitHub Actions", spec/harness.md "CI"), called by ci.yml once per runner.
# Every job runs one slice of `cargo xtask ci` (`--step`, `--unit-group`,
# `--shard`), so together they are exactly the old serial job:
#   cargo xtask ci                                   (lints, unit, self-check, kiln)
#   KILN_ORACLE=19 cargo xtask ci --quick --oracle-only   (ir_vs_clang, kiln)
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      # rust-cache's shared-key: one cache per architecture.
      cache-key: { type: string, required: true }
# On every job that runs xtask (spec/harness.md "CI"): a missing LLVM tool or
# GCC oracle is an error, never a skip.
# Likewise a missing gdb or lldb-19 for a `debugger` test (tests/debuginfo,
# WP-816): an ERROR, never a SKIP. The jobs that run those tests pass
# `debuggers: "true"` to the setup action (`ci_tests::workflow_installs_the_debuggers`).
env:
  KILN_REQUIRE_LLVM: "1"
  KILN_GCC: /usr/local/bin/g++
  KILN_REQUIRE_GCC: "1"
  KILN_REQUIRE_DEBUGGERS: "1"
  # And a `requires: sanitizer-runtime` run test (WP-1032) whose clangs find
  # no compiler-rt: the corpus jobs pass `sanitizer-runtimes: "true"`
  # (`ci_tests::workflow_installs_the_sanitizer_runtimes`, WP-1034).
  KILN_REQUIRE_SANITIZER_RUNTIME: "1"
defaults:
  run: { shell: bash }
jobs:
  # The reference environment (docs/VALIDATION.md "GitHub Actions"): Debian
  # 13 with Debian's clang 22.1.8 (the oracle) and 19.1.7 (the second
  # oracle) and GCC 14, as the development container, plus GCC 16.1 as the
  # reflection oracle. gcc:16.1.0-trixie is debian:trixie (buildpack-deps)
  # plus GCC 16.1 in /usr/local: its /usr/local/bin/{gcc,cc} come first on
  # PATH (Rust links with them); Debian's GCC 14 stays in
  # /usr/lib/gcc/<triple>/14, which clang and kiln detect for libstdc++;
  # every binary loads GCC 16.1's ABI-compatible libstdc++.so.6. Each job
  # checks out (the image ships git) and runs the setup action. The jobs that
  # run debugger tests add CAP_SYS_PTRACE to the container (gdb and lldb
  # trace the test binary; Docker's default seccomp profile allows ptrace,
  # and the scripts leave ASLR on, since `personality` is blocked).
  lints:
    name: lints
    runs-on: ${{ inputs.runner }}
    container: gcc:16.1.0-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with: { cache-key: "${{ inputs.cache-key }}" }
      - run: cargo xtask ci --step lints
  # `cargo test --workspace` in groups (xtask/src/main.rs UNIT_GROUPS; the
  # list below must name them all, `ci_tests::workflow_lists_the_unit_groups`).
  # `rest` builds the most test targets, so it alone saves the cache. The
  # codegen group also reruns the KILN_ORACLE-dependent targets with clang 19
  # (`--oracle-only --step unit`): its test binaries are already built.
  unit:
    name: unit ${{ matrix.group }}
    runs-on: ${{ inputs.runner }}
    container: &debugger-container
      image: gcc:16.1.0-trixie
      options: --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        group: [xtask, codegen, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with:
          cache-key: "${{ inputs.cache-key }}"
          save-cache: "${{ matrix.group == 'rest' }}"
          # The harness's end-to-end debugger fixtures (xtask group).
          debuggers: "${{ matrix.group == 'xtask' }}"
      - run: cargo xtask ci --step unit --unit-group ${{ matrix.group }}
      - if: ${{ !cancelled() && matrix.group == 'codegen' }}
        run: KILN_ORACLE=19 cargo xtask ci --oracle-only --step unit
  # The clang++-22 corpus self-check: the corpus must pass with the
  # reference compiler. No kiln build needed.
  self-check:
    name: self-check ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ inputs.runner }}
    container: *debugger-container
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with:
          cache-key: "${{ inputs.cache-key }}"
          debuggers: "true"
          sanitizer-runtimes: "true"
      - run: cargo xtask ci --step self-check --shard ${{ matrix.shard }}/${{ strategy.job-total }}
  # The kiln corpus run, oracle clang 22, in S shards. S is the length of
  # this list (THE constant to retune; kiln-19 reuses it via the anchor):
  # each job runs `--shard K/S` with S = strategy.job-total, so the list
  # and S cannot disagree and the shards always cover the whole corpus.
  kiln-22:
    name: kiln-22 ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ inputs.runner }}
    container: *debugger-container
    strategy:
      fail-fast: false
      matrix:
        shard: &kiln-shards [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with:
          cache-key: "${{ inputs.cache-key }}"
          debuggers: "true"
          sanitizer-runtimes: "true"
          cmake: "${{ matrix.shard == 1 }}"
      - run: cargo xtask ci --step kiln --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      # The CMake modules end-to-end (WP-982, WP-1034): the kiln++ the step
      # above built, as CMAKE_CXX_COMPILER with Ninja, in shard 1 only.
      - if: ${{ !cancelled() && matrix.shard == 1 }}
        run: KILN_OSS_CXX="$PWD/target/debug/kiln++" scripts/oss/selftest.sh --cmake-modules
  # The two-oracle policy (spec/harness.md "Oracle toolchain", WP-355): the
  # kiln corpus also stays green with clang 19 as the oracle.
  kiln-19:
    name: kiln-19 ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ inputs.runner }}
    container: *debugger-container
    strategy:
      fail-fast: false
      matrix:
        shard: *kiln-shards
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with:
          cache-key: "${{ inputs.cache-key }}"
          debuggers: "true"
          sanitizer-runtimes: "true"
      - run: >-
          KILN_ORACLE=19 cargo xtask ci --oracle-only --step kiln
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
