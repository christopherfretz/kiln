name: ci
on:
  push: { branches: [main] }
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.99.1", components: "rustfmt, clippy" }
      # Saved even when `ci` fails, so the next run starts warm.
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      # clang 19 + libc++ 19: the corpus oracle and the reference compiler of
      # the harness self-tests (spec/harness.md "CI").
      - run: sudo apt-get update && sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev
      # WP-226 discovery (temporary): every failing test binary and corpus
      # test at once.
      - run: |
          cargo test --workspace --no-fail-fast 2>&1 | grep -E '^test .*FAILED|panicked at|test result: FAILED|^error' || true
      - run: |
          cargo build -p kiln_driver && cargo xtask test --compiler clang++-19 2>&1 | grep -E -A3 '^(FAIL|XPASS|ERROR|KILLED) |^test result' | head -200 || true
      - run: |
          cargo xtask test 2>&1 | grep -E -A3 '^(FAIL|XPASS|ERROR|KILLED) |^test result' | head -200 || true
      # fmt, clippy, cargo test, then the corpus self-check with clang++-19.
      - run: cargo xtask ci
