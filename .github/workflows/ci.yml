name: ci
on:
  push: { branches: [main] }
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Two jobs rather than a matrix: a matrix would rename the required status
# check `check` to `check (<axis>)`. The shared steps live once in the
# composite action .github/actions/kiln-ci (WP-239); each job only installs
# git, which checkout needs before the local action can be read.
jobs:
  check:
    # The reference environment (docs/VALIDATION.md "GitHub Actions"): an
    # aarch64 Debian 13 host with Debian's clang 19.1.7 and GCC 14, as the
    # development container. The differential tests and goldens compare
    # against that clang on that host (search paths, target defaults,
    # va_list); target-dependent tests pin aarch64 or `requires:` it.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      KILN_REQUIRE_LLVM: "1"
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git >/dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
  check-x86_64:
    # The same Debian 13 environment on an x86-64 host (WP-228): the default
    # target is x86_64-unknown-linux-gnu, so this covers the host-dependent
    # paths (driver defaults, GCC detection, run tests natively on x86-64).
    # Not a required status check unless the branch rules say so.
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      KILN_REQUIRE_LLVM: "1"
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git >/dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
