name: ci
on:
  push: { branches: [main] }
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The gate fans out (WP-692, docs/VALIDATION.md "GitHub Actions"): each
# architecture is one call of the reusable workflow ci-lane.yml, whose jobs
# (lints, the unit-test groups, the sharded corpus runs) all run in
# parallel and show up as `arm / kiln-22 1/6` and so on. The two fan-in
# jobs keep the names of the REQUIRED status checks, `check` and
# `check-x86_64` (the main ruleset and the merge queue wait for them), so
# they are plain jobs: a matrix axis would rename them.
jobs:
  arm:
    # The reference environment: aarch64 Debian 13 (see ci-lane.yml).
    uses: ./.github/workflows/ci-lane.yml
    with: { runner: ubuntu-24.04-arm, cache-key: ci-arm }
  x86_64:
    # The same container on an x86-64 host (WP-228): the default target is
    # x86_64-unknown-linux-gnu, so the host-dependent paths (driver
    # defaults, GCC detection, run tests natively on x86-64) are covered.
    uses: ./.github/workflows/ci-lane.yml
    with: { runner: ubuntu-24.04, cache-key: ci-x86_64 }
  # Fan-in: passes only if every job of the lane succeeded. `always()` so a
  # failed, cancelled or skipped lane makes this job FAIL (a skipped
  # required check would otherwise count as passing).
  check:
    needs: [arm]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: every arm job succeeded
        run: |
          echo "arm lane: ${{ needs.arm.result }}"
          test "${{ needs.arm.result }}" = success
  check-x86_64:
    needs: [x86_64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: every x86_64 job succeeded
        run: |
          echo "x86_64 lane: ${{ needs.x86_64.result }}"
          test "${{ needs.x86_64.result }}" = success
