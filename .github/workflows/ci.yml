name: ci
on:
  push: { branches: [main] }
  pull_request:
  merge_group:
# A read-only default token (WP-1901; docs/VALIDATION.md "GitHub
# Actions"): no job of ci.yml or ci-lane.yml writes to the repository or
# calls the API. Caches and artifacts use the runner's own token, and the
# merge queue needs nothing from the workflow but its checks. A job that
# needs more gets its own `permissions:` block
# (`ci_tests::workflows_default_to_a_read_only_token`).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The gate fans out (WP-692, docs/VALIDATION.md "GitHub Actions"): each
# architecture is one call of the reusable workflow ci-lane.yml, whose jobs
# (lints, the unit-test groups, the sharded corpus runs) all run in
# parallel and show up as `arm / kiln-22 1/6` and so on. The two fan-in
# jobs keep the names of the REQUIRED status checks, `check` and
# `check-x86_64` (the main ruleset and the merge queue wait for them), so
# they are plain jobs: a matrix axis would rename them.
# A job that calls a reusable workflow cannot carry `timeout-minutes`:
# the jobs of ci-lane.yml carry their own (docs/VALIDATION.md "Job
# timeouts", WP-1600).
jobs:
  arm:
    # The reference environment: aarch64 Debian 13 (see ci-lane.yml).
    uses: ./.github/workflows/ci-lane.yml
    with: { runner: ubuntu-24.04-arm, cache-key: ci-arm }
  x86_64:
    # The same container on an x86-64 host (WP-228): the default target is
    # x86_64-unknown-linux-gnu, so the host-dependent paths (driver
    # defaults, GCC detection, run tests natively on x86-64) are covered.
    uses: ./.github/workflows/ci-lane.yml
    with: { runner: ubuntu-24.04, cache-key: ci-x86_64 }
  # Fan-in: passes only if every job of the lane succeeded. `always()` so a
  # failed, cancelled or skipped lane makes this job FAIL (a skipped
  # required check would otherwise count as passing).
  check:
    needs: [arm]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: every arm job succeeded
        run: |
          echo "arm lane: ${{ needs.arm.result }}"
          test "${{ needs.arm.result }}" = success
  check-x86_64:
    needs: [x86_64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every x86_64 job succeeded
        run: |
          echo "x86_64 lane: ${{ needs.x86_64.result }}"
          test "${{ needs.x86_64.result }}" = success
  # The kiln_hod workspace (WP-1703, K6; spec/driver.md "In-process back
  # end"): kiln++ with hod linked in process, built --locked from its own
  # lock (hod by git revision), its tests (programs run, a decline falls
  # back, a contained panic, `.mason.meta` through hod, the stock compiler
  # without the flag) and the equality sweep of tests/codegen against the
  # stock kiln++ driving hod's executable. NOT in the required set: no
  # `check` job needs it, so a fetch of hod that fails cannot hold the
  # merge queue; a red run is still shown on the PR.
  kiln-hod:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container: gcc:16.1.0-trixie
    env:
      KILN_REQUIRE_LLVM: "1"
      KILN_GCC: /usr/local/bin/g++
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kiln-ci
        with: { cache-key: kiln-hod-arm, save-cache: "true" }
      - run: cargo xtask kiln-hod test
      # The bridge (seam K3a): IR equality with hod's text reader, then the
      # object sweep with the bridged object also compared in process with
      # the text path's (`--dual`).
      - run: cargo xtask kiln-hod bridge-eq tests/codegen
      - run: cargo xtask kiln-hod sweep --dual tests/codegen
