[mp_units]
url = "https://github.com/mpusz/mp-units"
tag = "v2.5.0"
build = "cmake"
cxx_std = 20
configure = ["-DMP_UNITS_API_CONTRACTS=NONE", "-DMP_UNITS_BUILD_CXX_MODULES=OFF"]
deps = ["catch2"]
test = "ctest --output-on-failure -j 4"
c_compiler = "clang-19"
control_cxx = "g++-16"
wave = 4
verified = true
notes = "WP-792. clang 19 cannot build mp-units (its documented unfixable clang 19 bug, llvm-project PR 118288: type constraint differs in template redeclaration), and clang 22 rejects most of v2.5.0 too (no viable deduction guide for quantity in quantity_spec.h), so the control is GCC 16 (control_cxx; g++-16 must be on PATH). Catch2 (the toml catch2 row) is a dependency built with clang 19; contracts off (no gsl-lite). test/static is static_assert-only; test/runtime is Catch2."

