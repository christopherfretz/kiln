build = "cmake"
cxx_std = 17
configure = ["-DBUILD_TESTING=ON", "-DWITH_GFLAGS=OFF", "-DWITH_GTEST=OFF", "-DWITH_UNWIND=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Archived upstream; v0.7.1 is the last release."

[yaml_cpp]
url = "https://github.com/jbeder/yaml-cpp"
tag = "yaml-cpp-0.9.0"
build = "cmake"
cxx_std = 17
configure = ["-DYAML_CPP_BUILD_TESTS=ON", "-DYAML_CPP_BUILD_TOOLS=OFF", "-DCMAKE_CXX_FLAGS=-Wno-c++11-narrowing"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Tests use a vendored googletest."

[simdjson]
url = "https://github.com/simdjson/simdjson"
tag = "v4.2.4"
build = "cmake"
cxx_std = 20
configure = ["-DSIMDJSON_DEVELOPER_MODE=ON", "-DSIMDJSON_ENABLE_THREADS=ON", "-DSIMDJSON_EXCEPTIONS=ON"]
test = "ctest --output-on-failure -E 'checkperf|fuzz'"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Developer mode downloads test data; target-specific SIMD kernels (NEON on aarch64, AVX on x86_64) exercise intrinsics headers."

[eigen]
url = "https://gitlab.com/libeigen/eigen.git"
tag = "3.4.1"
build = "cmake"
cxx_std = 17
configure = ["-DBUILD_TESTING=ON", "-DEIGEN_BUILD_DOC=OFF", "-DEIGEN_BUILD_BLAS=OFF", "-DEIGEN_BUILD_LAPACK=OFF"]
build_targets = ["clz", "rand", "meta", "numext", "sizeof", "dynalloc", "nomalloc", "first_aligned", "type_alias", "nullary", "mixingtypes", "io", "packetmath", "vectorization_logic", "basicstuff", "constructor", "integer_types", "unalignedcount", "exceptions", "redux", "visitor", "block", "corners", "symbolic_index", "indexed_view", "reshape", "swap", "resize", "conservative_resize", "product_small", "product_large", "diagonalmatrices", "diagonal", "miscmatrices", "commainitializer", "smallvectors", "mapped_matrix", "mapstride", "array_cwise", "array_for_matrix", "array_replicate", "ref", "is_same_dense", "triangular", "selfadjoint", "product_trmv", "product_notemporary", "stable_norm", "permutationmatrices", "bandmatrix", "cholesky", "lu", "determinant", "inverse", "qr", "qr_colpivoting", "jacobisvd", "eigensolver_generic", "schur_real", "hessenberg", "householder", "jacobi", "geo_quaternion", "geo_transformations", "geo_orthomethods", "geo_hyperplane", "stdvector", "stdlist", "stddeque", "sparse_basic", "sparse_vector", "sparse_product", "sparse_solvers", "sparse_permutations", "simplicial_cholesky", "conjugate_gradient", "sparselu", "nesting_ops", "nestbyvalue", "zerosized", "evaluators", "sizeoverflow", "prec_inverse_4x4", "vectorwiseop", "special_numbers", "rvalue_types", "dense_storage", "ctorleak", "half_float", "bfloat16_float", "array_of_string", "num_dimensions", "stl_iterators", "initializer_list_construction", "diagonal_matrix_variadic_ctor", "fastmath", "autodiff_scalar", "autodiff", "matrix_function", "splines", "kronecker_product", "special_functions", "cxx11_meta", "cxx11_maxsizevector", "cxx11_eventcount", "cxx11_runqueue", "cxx11_non_blocking_thread_pool", "cxx11_tensor_argmax", "cxx11_tensor_assign", "cxx11_tensor_broadcasting", "cxx11_tensor_casts", "cxx11_tensor_chipping", "cxx11_tensor_comparisons", "cxx11_tensor_concatenation", "cxx11_tensor_const", "cxx11_tensor_contraction", "cxx11_tensor_custom_index", "cxx11_tensor_dimension", "cxx11_tensor_expr", "cxx11_tensor_fixed_size", "cxx11_tensor_index_list", "cxx11_tensor_map", "cxx11_tensor_math", "cxx11_tensor_morphing", "cxx11_tensor_reduction", "cxx11_tensor_simple", "cxx11_tensor_sugar", "cxx11_tensor_uint128", "cxx11_tensor_intdiv", "cxx11_tensor_of_strings", "cxx11_tensor_scan", "cxx11_tensor_shuffling"]
test = "ctest --output-on-failure -R '^(clz|rand|meta|numext|sizeof|dynalloc|nomalloc|first_aligned|type_alias|nullary|mixingtypes|io|packetmath|vectorization_logic|basicstuff|constructor|integer_types|unalignedcount|exceptions|redux|visitor|block|corners|symbolic_index|indexed_view|reshape|swap|resize|conservative_resize|product_small|product_large|diagonalmatrices|diagonal|miscmatrices|commainitializer|smallvectors|mapped_matrix|mapstride|array_cwise|array_for_matrix|array_replicate|ref|is_same_dense|triangular|selfadjoint|product_trmv|product_notemporary|stable_norm|permutationmatrices|bandmatrix|cholesky|lu|determinant|inverse|qr|qr_colpivoting|jacobisvd|eigensolver_generic|schur_real|hessenberg|householder|jacobi|geo_quaternion|geo_transformations|geo_orthomethods|geo_hyperplane|stdvector|stdlist|stddeque|sparse_basic|sparse_vector|sparse_product|sparse_solvers|sparse_permutations|simplicial_cholesky|conjugate_gradient|sparselu|nesting_ops|nestbyvalue|zerosized|evaluators|sizeoverflow|prec_inverse_4x4|vectorwiseop|special_numbers|rvalue_types|dense_storage|ctorleak|half_float|bfloat16_float|array_of_string|num_dimensions|stl_iterators|initializer_list_construction|diagonal_matrix_variadic_ctor|fastmath|autodiff_scalar|autodiff|matrix_function|splines|kronecker_product|special_functions|cxx11_meta|cxx11_maxsizevector|cxx11_eventcount|cxx11_runqueue|cxx11_non_blocking_thread_pool|cxx11_tensor_argmax|cxx11_tensor_assign|cxx11_tensor_broadcasting|cxx11_tensor_casts|cxx11_tensor_chipping|cxx11_tensor_comparisons|cxx11_tensor_concatenation|cxx11_tensor_const|cxx11_tensor_contraction|cxx11_tensor_custom_index|cxx11_tensor_dimension|cxx11_tensor_expr|cxx11_tensor_fixed_size|cxx11_tensor_index_list|cxx11_tensor_map|cxx11_tensor_math|cxx11_tensor_morphing|cxx11_tensor_reduction|cxx11_tensor_simple|cxx11_tensor_sugar|cxx11_tensor_uint128|cxx11_tensor_intdiv|cxx11_tensor_of_strings|cxx11_tensor_scan|cxx11_tensor_shuffling)(_[0-9]+)?$'"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "GitLab, not GitHub. The full suite is ~1000 TUs, several at multi-GiB with clang: build_targets and the ctest -R filter pick a 132-test subset (539 TUs; see docs/status/oss/eigen.md). Eigen compiles its tests as C++11 whatever cxx_std says."

[entt]
url = "https://github.com/skypjack/entt"
tag = "v3.15.0"
build = "cmake"
cxx_std = 20
configure = ["-DENTT_BUILD_TESTING=ON", "-DENTT_BUILD_BENCHMARK=OFF", "-DENTT_BUILD_EXAMPLE=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "googletest is fetched with FetchContent at GIT_TAG main (unpinned)."

[taskflow]
url = "https://github.com/taskflow/taskflow"
tag = "v3.10.0"
build = "cmake"
cxx_std = 20
configure = ["-DTF_BUILD_TESTS=ON", "-DTF_BUILD_EXAMPLES=OFF", "-DTF_BUILD_BENCHMARKS=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Threads, coroutine-free task graphs; tests use the bundled doctest."

[cereal]
url = "https://github.com/USCiLab/cereal"
tag = "v1.3.2"
build = "cmake"
cxx_std = 17
configure = ["-DBUILD_TESTS=ON", "-DSKIP_PERFORMANCE_COMPARISON=ON", "-DSKIP_PORTABILITY_TEST=ON", "-DBUILD_SANDBOX=OFF", "-DBUILD_DOC=OFF", "-DWITH_WERROR=OFF", "-DCEREAL_INSTALL=OFF", "-DCMAKE_CXX_FLAGS=-Wno-error=missing-template-arg-list-after-template-kw -Wno-error=c++11-narrowing-const-reference"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 2
verified = true
notes = "Boost-dependent tests are skipped when Boost is absent. The 32-bit (-m32) portability tests are skipped (no multilib on aarch64); clang 19 default-error warnings in cereal tuple.hpp and the aarch64 unsigned-char narrowing in the unit tests are demoted to warnings."

