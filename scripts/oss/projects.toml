configure = ["-DBUILD_TESTING=ON", "-DBOOST_INCLUDE_LIBRARIES=mp11;hana;fusion;mpl;pfr;describe;variant2;variant;spirit;yap;type_traits;tuple;optional;outcome;static_string;callable_traits;type_index;function_types;lambda2;hof", "-DKILN_BOOST_JAMFILE_LIBRARIES=hana;fusion;variant;spirit;yap;type_traits;callable_traits;hof", "-DCMAKE_PROJECT_Boost_INCLUDE=@OSS@/shims/boost-jamfile-tests.cmake"]
