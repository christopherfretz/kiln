# M8 robustness: the open-source projects kiln builds through their own
# build systems (docs/status/oss.md, spec/landed/harness/WP-666.md).
#
# One table per project, keyed by the name `oss-build.sh <project>` takes.
#   url            git URL (cloned with --depth 1 --branch <tag>)
#   tag            pinned release tag (checked with `git ls-remote --tags`)
#   build          cmake | meson | make   (only cmake is driven end to end)
#   cxx_std        CMAKE_CXX_STANDARD (or meson cpp_std)
#   configure      extra configure flags, a list
#   build_targets  optional list of make targets (default: all)
#   test           shell command run in the build dir under `timeout 1800`
#   c_compiler     the C compiler (kiln is C++-only), default clang-19
#   wave           1, 2, 3 or 4 (docs/ROADMAP.md M8)
#   verified       true once the configure flags were run end to end
#   submodules     optional: clone with --recurse-submodules
#   source_subdir  optional: the CMake source dir inside the checkout
#   checkout       optional: the .oss/src/<name> directory (default: the
#                  project name); rows sharing one must share url/tag/submodules
#   notes          free text

# ---------------------------------------------------------------- wave 1

[fmt]
url = "https://github.com/fmtlib/fmt"
tag = "12.1.0"
build = "cmake"
cxx_std = 20
configure = ["-DFMT_TEST=ON", "-DFMT_DOC=OFF", "-DFMT_PEDANTIC=OFF"]
test = "ctest --output-on-failure"
c_compiler = "clang-19"
wave = 1
verified = false
notes = "WP-667 drives this one with its own wrapper until the harness lands."

[nlohmann_json]
url = "https://github.com/nlohmann/json"
