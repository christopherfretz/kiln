[llvm_project]
url = "https://github.com/llvm/llvm-project"
tag = "llvmorg-19.1.7"
build = "cmake"
source_subdir = "llvm"
cxx_std = 17
configure = ["-DLLVM_TARGETS_TO_BUILD=", "-DLLVM_ENABLE_PROJECTS=", "-DLLVM_INCLUDE_TESTS=ON", "-DLLVM_INCLUDE_BENCHMARKS=OFF", "-DLLVM_INCLUDE_EXAMPLES=OFF", "-DLLVM_ENABLE_ZSTD=OFF", "-DLLVM_ENABLE_LIBXML2=OFF"]
build_targets = ["SupportTests", "ADTTests"]
test = "./unittests/Support/SupportTests && ./unittests/ADT/ADTTests"
c_compiler = "clang-19"
wave = 3
verified = false
notes = "lib/Support + lib/ADT unit tests only. Same release as the libc++ 19 test suite; the shallow clone is ~2 GB."

[folly]
url = "https://github.com/facebook/folly"
tag = "v2026.10.26.00"
build = "cmake"
cxx_std = 20
configure = ["-DBUILD_TESTS=ON", "-DCMAKE_PROJECT_folly_INCLUDE=@OSS@/shims/folly-no-liburing.cmake"]
test = "ctest --output-on-failure --timeout 300 -E WriteFileAtomic.directoryPermissions"
c_compiler = "clang-19"
wave = 3
verified = false
notes = "WP-726. Needs boost, double-conversion, gflags, glog, libevent, fmt and fast_float installed. The shim forces FOLLY_HAS_LIBURING 0 (the container's liburing 2.9 lacks the 2.10 zero-copy receive API folly uses). googletest 1.17 is fetched at configure time. The excluded test expects a permission error that root does not get."
