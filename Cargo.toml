[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherfretz/kiln"

[workspace.dependencies]
kiln_snap_derive = { path = "crates/kiln_snap_derive" }
kiln_snap    = { path = "crates/kiln_snap" }
kiln_source  = { path = "crates/kiln_source" }
kiln_diag    = { path = "crates/kiln_diag" }
kiln_lex     = { path = "crates/kiln_lex" }
kiln_pp      = { path = "crates/kiln_pp" }
kiln_ast     = { path = "crates/kiln_ast" }
kiln_parse   = { path = "crates/kiln_parse" }
kiln_sema    = { path = "crates/kiln_sema" }
kiln_oven    = { path = "crates/kiln_oven" }
kiln_abi     = { path = "crates/kiln_abi" }
kiln_llvm    = { path = "crates/kiln_llvm" }
kiln_codegen = { path = "crates/kiln_codegen" }
kiln_driver  = { path = "crates/kiln_driver" }
# Third-party (each approved in a work package; see docs/AGENTS.md rule 7).
# hashbrown: `HashTable` for key-in-arena interning (spec/types.md §7.1, §17 T1).
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
# signal-hook: xtask returns its held jobserver tokens on SIGINT/SIGTERM
# (WP-157, spec/harness.md "Jobserver"); the signal-handler `unsafe` stays in
# the dependency, xtask itself remains `forbid(unsafe_code)`.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The pinned clippy (Rust 1.95, `rust-toolchain.toml`) reports `match` arms
# whose body is a single `if` as collapsible; a guard would instead fall
# through to the next arm, so every such site is a false positive here.
collapsible_match = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# Thin LTO with 4 codegen units (WP-326, spec/libcxx.md "Build profiles"):
# measured against `harness`, fat LTO and one codegen unit on the
# libcxx-slice and bench/frontend, it is as fast as either alternative
# (within 2%) and 7-9% faster than `harness`, for a 51 s clean build where
# fat LTO takes 119 s and one unit 71 s. Every profile keeps the default
# `panic = "unwind"` (WP-911): the driver's internal-compiler-error handler
# (spec/driver.md "Internal compiler errors") lets a panic unwind to `main`,
# where it prints the banner and writes the crash reproducer; under
# `panic = "abort"` the hook would print the banner but nothing could run
# after it (no reproducer, no exit code of our choosing).
[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

# The preprocessor's per-token path (Lexer::next -> Preprocessor::next ->
# SourceManager lookups) spans these three crates; splitting them into several
# codegen units costs ~8% of `kiln -E` wall clock on bench/pp/headers.cpp even
# with thin LTO (WP-056, docs/status/perf.md). They are small, so one unit each
# adds little build time.
[profile.release.package.kiln_lex]
codegen-units = 1

[profile.release.package.kiln_source]
codegen-units = 1

[profile.release.package.kiln_pp]
codegen-units = 1

[profile.bench]
inherits = "release"

# What `cargo xtask dist` builds the release tarballs with (WP-927,
# spec/driver.md "Installation layout"): exactly `release` (thin LTO, line
# tables), in its own directory so a dist build never overwrites a local
# `release` binary. xtask splits the debug info off afterwards (`objcopy
# --only-keep-debug`, `--strip-debug --add-gnu-debuglink`), so the profile
# keeps it.
[profile.dist]
inherits = "release"
strip = false

# What `cargo xtask libcxx` / `libstdcxx` build by default (WP-319,
# spec/libcxx.md "Build profiles"): optimized like `release`, but without LTO
# and with more codegen units so a clean build stays cheap (and runs ~7%
# slower than `release`; WP-326), line tables so a
# panic backtrace stays readable, and incremental rebuilds. Debug assertions
# and overflow checks are off, as in `release`: the suite measures the
# compiler users run.
[profile.harness]
inherits = "release"
opt-level = 3
debug = 1
lto = false
codegen-units = 16
incremental = true
debug-assertions = false
overflow-checks = false
