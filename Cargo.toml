[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherfretz/kiln"

[workspace.dependencies]
kiln_source  = { path = "crates/kiln_source" }
kiln_diag    = { path = "crates/kiln_diag" }
kiln_lex     = { path = "crates/kiln_lex" }
kiln_pp      = { path = "crates/kiln_pp" }
kiln_ast     = { path = "crates/kiln_ast" }
kiln_parse   = { path = "crates/kiln_parse" }
kiln_sema    = { path = "crates/kiln_sema" }
kiln_oven    = { path = "crates/kiln_oven" }
kiln_abi     = { path = "crates/kiln_abi" }
kiln_llvm    = { path = "crates/kiln_llvm" }
kiln_codegen = { path = "crates/kiln_codegen" }
# Third-party (each approved in a work package; see docs/AGENTS.md rule 7).
# hashbrown: `HashTable` for key-in-arena interning (spec/types.md §7.1, §17 T1).
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

# The preprocessor's per-token path (Lexer::next -> Preprocessor::next ->
# SourceManager lookups) spans these three crates; splitting them into several
# codegen units costs ~8% of `kiln -E` wall clock on bench/pp/headers.cpp even
# with thin LTO (WP-056, docs/status/perf.md). They are small, so one unit each
# adds little build time.
[profile.release.package.kiln_lex]
codegen-units = 1

[profile.release.package.kiln_source]
codegen-units = 1

[profile.release.package.kiln_pp]
codegen-units = 1

[profile.bench]
inherits = "release"
