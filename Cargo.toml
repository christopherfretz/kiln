[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherfretz/kiln"

[workspace.dependencies]
kiln_source  = { path = "crates/kiln_source" }
kiln_diag    = { path = "crates/kiln_diag" }
kiln_lex     = { path = "crates/kiln_lex" }
kiln_pp      = { path = "crates/kiln_pp" }
kiln_ast     = { path = "crates/kiln_ast" }
kiln_parse   = { path = "crates/kiln_parse" }
kiln_sema    = { path = "crates/kiln_sema" }
kiln_oven    = { path = "crates/kiln_oven" }
kiln_abi     = { path = "crates/kiln_abi" }
kiln_llvm    = { path = "crates/kiln_llvm" }
kiln_codegen = { path = "crates/kiln_codegen" }
# Third-party (each approved in its WP; see spec/types.md §17 T1).
hashbrown    = { version = "0.15", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"
